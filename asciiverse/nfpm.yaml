# System packages (.deb, .rpm, .apk, Arch) for zoridor, built by nfpm from
# the same static binary as the av archive. The release workflow sets
# VERSION (upstream's, with the upstream commit's date as semver metadata,
# e.g. 0.0.0+20250117; nfpm writes that part the way each format wants it),
# RELEASE (our packaging release) and ARCH (amd64 or arm64), and puts the
# binary at stage/zoridor.
#
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries (asciiverse/CLAUDE.md).
name: zoridor
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/zoridor
license: MIT
description: |
  Quoridor for the terminal, against the machine.
  Race your pawn across a 9 by 9 board while you and the machine wall each
  other in with fences. By Ringtail Software, packaged by Asciiverse.
contents:
  - src: stage/zoridor
    dst: /usr/bin/zoridor
    file_info: { mode: 0755 }
  - src: LICENSE.md
    dst: /usr/share/doc/zoridor/copyright
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/zoridor/README.md
    file_info: { mode: 0644 }
