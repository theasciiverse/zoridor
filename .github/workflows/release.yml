# Builds zoridor for the Asciiverse catalog and as system packages.
#
# For av: one archive per target, named <id>-<target>.tar.gz, plus a
# SHA256SUMS file, attached to a GitHub release (hub/catalog/SCHEMA.md,
# release.source = "github").
# For everyone else: .deb, .rpm, .apk and Arch packages from the same static
# Linux binaries, made by nfpm (asciiverse/nfpm.yaml).
#
# Tags look like v0.0.0+20250117-av.1: upstream's version (0.0.0, it has no
# releases) and the date of the upstream commit, then our packaging release.
# Zig cross-compiles, so one Linux runner builds every target: Linux static
# (musl) and macOS 11 and later; Zig signs the Apple Silicon binary ad hoc.
# No Windows: the mibu terminal library is POSIX only.

name: release

on:
  push:
    tags: ["v*-av.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: zoridor
  BIN: zoridor
  TAG: ${{ inputs.tag || github.ref_name }}
  ZIG: "0.14.0"
  ZIG_SHA256: 473ec26806133cf4d1918caf1a410f8403a13d979726a9045b421b685031a982

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Zig
        run: |
          curl -sSfLO "https://ziglang.org/download/$ZIG/zig-linux-x86_64-$ZIG.tar.xz"
          echo "$ZIG_SHA256  zig-linux-x86_64-$ZIG.tar.xz" | sha256sum -c
          tar -xf "zig-linux-x86_64-$ZIG.tar.xz"
          echo "$PWD/zig-linux-x86_64-$ZIG" >> "$GITHUB_PATH"

      - name: Build and package for av
        run: |
          mkdir -p dist
          while read -r target zigtarget; do
            rm -rf stage && mkdir -p stage
            zig build -Doptimize=ReleaseSafe -Dtarget="$zigtarget" --prefix "out/$target"
            case "$target" in
              *linux*) zig objcopy --strip-all "out/$target/bin/$BIN" "stage/$BIN" ;;
              *) cp "out/$target/bin/$BIN" "stage/$BIN" ;;
            esac
            file "stage/$BIN"
            # the binary sits at the top of the archive, where av looks for it
            cp LICENSE.md README.md stage/
            tar -czf "dist/$ID-$target.tar.gz" -C stage .
          done <<'TARGETS'
          x86_64-unknown-linux-musl x86_64-linux-musl
          aarch64-unknown-linux-musl aarch64-linux-musl
          x86_64-apple-darwin x86_64-macos.11.0
          aarch64-apple-darwin aarch64-macos.11.0
          TARGETS

      - name: System packages
        run: |
          v="${TAG#v}"; export VERSION="${v%%-av.*}" RELEASE="${TAG##*-av.}"
          for pair in "amd64 x86_64-unknown-linux-musl" "arm64 aarch64-unknown-linux-musl"; do
            set -- $pair; export ARCH="$1"
            rm -rf stage && mkdir -p stage
            zig objcopy --strip-all "out/$2/bin/$BIN" "stage/$BIN"
            for p in deb rpm apk archlinux; do
              docker run --rm -u "$(id -u):$(id -g)" -v "$PWD":/src -w /src \
                -e VERSION -e RELEASE -e ARCH goreleaser/nfpm:v2.43.0 \
                package --config asciiverse/nfpm.yaml --packager "$p" --target dist/
            done
          done
          ls -l dist

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "zoridor $TAG" \
                 --notes "zoridor ${TAG%%-av.*} from github.com/ringtailsoftware/zoridor, built for the Asciiverse catalog, with .deb, .rpm, .apk and Arch packages. Changes from upstream: see PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
